<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mixam's Autos - Inventory</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .hero {
      background: linear-gradient(rgba(11, 31, 58, 0.88), rgba(11, 31, 58, 0.95)), 
                  url('https://images.unsplash.com/photo-1609521263047-f8f205293f24') center/cover no-repeat fixed;
      color: white;
      padding: 100px 5% 80px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .subtitle-box {
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 18px 24px;
      margin: 0 auto 40px;
      max-width: 520px;
      font-size: 17px;
      line-height: 1.5;
      backdrop-filter: blur(8px);
    }

    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      height: 58px;
      padding: 0 28px;
      border-radius: 9999px;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #2563EB;
      color: white;
    }
    .btn-primary:hover {
      background: #1E40AF;
      transform: translateY(-3px);
    }

    .btn-secondary {
      background: transparent;
      color: white;
      border: 2px solid rgba(255,255,255,0.7);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      border-color: white;
      transform: translateY(-3px);
    }

    /* Mobile improvements */
    @media (max-width: 768px) {
      .hero h1 { font-size: 34px; }
      .hero { padding: 80px 5% 60px; min-height: auto; }
      .subtitle-box { margin-bottom: 32px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mixam's Autos</h1>
  </header>

  <main>
    <!-- Hero - styled like your screenshot -->
    <section class="hero">
      <h1>Drive Your Dream Car Today</h1>
      
      <div class="subtitle-box">
        Quality Used Vehicles • Easy Financing • Nationwide Delivery
      </div>

      <div class="hero-buttons">
        <a href="#inventory" class="btn btn-primary">Browse Inventory</a>
        <a href="financing.html" class="btn btn-secondary">Apply for Financing</a>
        <a href="trade-in.html" class="btn btn-secondary">Trade In Your Car</a>
        <a href="reservation.html" class="btn btn-secondary">Reserve a Vehicle</a>
      </div>
    </section>

    <!-- Inventory -->
    <section id="inventory" class="filters" style="padding: 60px 5% 40px; background: white;">
      <h2 style="text-align: center; margin-bottom: 30px;">Our Inventory</h2>
      <div class="filter-controls" style="text-align: center; margin-bottom: 30px;">
        <label>Sort by:</label>
        <select id="sortSelect">
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="year-desc">Newest First</option>
        </select>
      </div>
    </section>

    <section class="car-grid" id="carGrid" style="padding: 0 5% 60px; background: white;">
      <!-- Cars added by script.js -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mixam's Autos. All rights reserved. | Contact: mixam1autos@outlook.com</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
