<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mixam's Autos</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo">Mixam's Autos</div>
      <nav>
        <a href="#inventory">Inventory</a>
        <a href="financing.html">Financing</a>
        <a href="reservation.html">Reserve</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1>Drive Your Dream Car Today</h1>
      <p>Quality Used Vehicles • Easy Financing • Nationwide Delivery</p>
      <div class="hero-buttons">
        <a href="#inventory" class="btn btn-primary">Browse Inventory</a>
        <a href="financing.html" class="btn btn-secondary">Apply for Financing</a>
      </div>
    </div>
  </section>

  <!-- Inventory -->
  <section id="inventory" class="section">
    <div class="container">
      <h2>Our Inventory</h2>
      <div class="car-grid" id="carGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Mixam's Autos. All rights reserved.</p>
    </div>
  </footer>

  <!-- Modal -->
  <div id="carModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modalImg" src="" alt="">
      <div id="thumbnails" class="thumbnails"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalFullDesc" class="modal-desc"></div>
      <div class="modal-buttons">
        <a id="modalEmail" href="#" class="btn btn-primary">Contact Dealer</a>
        <a href="reservation.html" class="btn btn-secondary">Reserve Vehicle</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
