<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mixam's Autos - Inventory</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .hero {
      background: linear-gradient(rgba(11, 31, 58, 0.78), rgba(31, 58, 95, 0.88)), 
                  url('https://images.unsplash.com/photo-1609521263047-f8f205293f24') center/cover no-repeat;
      color: white;
      padding: 110px 5% 80px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* Professional animation for hero content */
    .hero-content {
      animation: fadeInUp 1.2s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 46px;
      font-weight: 700;
      line-height: 1.12;
      margin-bottom: 18px;
    }
    .hero .subtitle {
      font-size: 18px;
      color: #D1D5DB;
      max-width: 560px;
      margin: 0 auto 42px;
      line-height: 1.5;
    }
    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      height: 56px;
      padding: 0 34px;
      border-radius: 10px;
      font-size: 16.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      min-width: 210px;
      transition: all 0.4s ease;
    }
    .btn-primary {
      background: #2563EB;
      color: white;
      box-shadow: 0 6px 20px rgba(37,99,235,0.3);
    }
    .btn-primary:hover {
      background: #1E40AF;
      transform: translateY(-4px) scale(1.03);
    }
    .btn-secondary {
      background: transparent;
      color: white;
      border: 2px solid #9CA3AF;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }

    /* Mobile improvements */
    @media (max-width: 768px) {
      .hero h1 { font-size: 34px; }
      .hero { padding: 80px 5% 60px; min-height: auto; }
      .hero-buttons { flex-direction: column; align-items: center; }
      .btn { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mixam's Autos</h1>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero-content">
        <h1>Drive Your Dream Car Today</h1>
        <p class="subtitle">Quality Used Vehicles • Easy Financing • Nationwide Delivery</p>
        <div class="hero-buttons">
          <a href="#inventory" class="btn btn-primary">Browse Inventory</a>
          <a href="financing.html" class="btn btn-secondary">Apply for Financing</a>
          <a href="trade-in.html" class="btn btn-secondary">Trade In Your Car</a>
          <a href="reservation.html" class="btn btn-secondary">Reserve a Vehicle</a>
        </div>
      </div>
    </section>

    <!-- Inventory -->
    <section id="inventory" class="filters" style="padding: 60px 5% 40px; background: white;">
      <h2 style="text-align: center; margin-bottom: 30px;">Our Inventory</h2>
      <div class="filter-controls" style="text-align: center; margin-bottom: 30px;">
        <label>Sort by:</label>
        <select id="sortSelect">
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="year-desc">Newest First</option>
        </select>
      </div>
    </section>

    <section class="car-grid" id="carGrid" style="padding: 0 5% 60px; background: white;">
      <!-- Cars added by script.js -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mixam's Autos. All rights reserved. | Contact: mixam1autos@outlook.com</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
