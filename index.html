<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mixam's Autos - Inventory</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .hero {
      background: linear-gradient(rgba(11, 31, 58, 0.78), rgba(31, 58, 95, 0.92)), 
                  url('https://images.unsplash.com/photo-1609521263047-f8f205293f24') center/cover no-repeat fixed;
      color: white;
      padding: 110px 5% 90px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Advanced layered animation */
    .hero-content {
      animation: fadeInUp 1.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 18px;
      animation: textReveal 1.2s ease forwards 0.3s;
    }

    .hero .subtitle {
      font-size: 18px;
      color: #D1D5DB;
      max-width: 560px;
      margin: 0 auto 42px;
      opacity: 0;
      animation: fadeInUp 1.4s ease forwards 0.8s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(60px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textReveal {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 1.2s ease forwards 1.2s;
    }

    .btn {
      height: 56px;
      padding: 0 34px;
      border-radius: 10px;
      font-size: 16.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      min-width: 210px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: 0.6s;
    }

    .btn:hover::before {
      left: 200%;
    }

    .btn-primary {
      background: #2563EB;
      color: white;
      box-shadow: 0 8px 25px rgba(37,99,235,0.35);
    }
    .btn-primary:hover {
      background: #1E40AF;
      transform: translateY(-5px) scale(1.04);
      box-shadow: 0 12px 30px rgba(37,99,235,0.45);
    }

    .btn-secondary {
      background: transparent;
      color: white;
      border: 2px solid #9CA3AF;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-3px);
      border-color: #D1D5DB;
    }

    /* Mobile improvements */
    @media (max-width: 768px) {
      .hero h1 { font-size: 34px; }
      .hero { padding: 80px 5% 60px; min-height: auto; }
      .hero-buttons { flex-direction: column; align-items: center; }
      .btn { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mixam's Autos</h1>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero-content">
        <h1>Drive Your Dream Car Today</h1>
        <p class="subtitle">Quality Used Vehicles • Easy Financing • Nationwide Delivery</p>
        <div class="hero-buttons">
          <a href="#inventory" class="btn btn-primary">Browse Inventory</a>
          <a href="financing.html" class="btn btn-secondary">Apply for Financing</a>
          <a href="trade-in.html" class="btn btn-secondary">Trade In Your Car</a>
          <a href="reservation.html" class="btn btn-secondary">Reserve a Vehicle</a>
        </div>
      </div>
    </section>

    <!-- Inventory -->
    <section id="inventory" class="filters" style="padding: 60px 5% 40px; background: white;">
      <h2 style="text-align: center; margin-bottom: 30px;">Our Inventory</h2>
      <div class="filter-controls" style="text-align: center; margin-bottom: 30px;">
        <label>Sort by:</label>
        <select id="sortSelect">
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="year-desc">Newest First</option>
        </select>
      </div>
    </section>

    <section class="car-grid" id="carGrid" style="padding: 0 5% 60px; background: white;">
      <!-- Cars added by script.js -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mixam's Autos. All rights reserved. | Contact: mixam1autos@outlook.com</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
