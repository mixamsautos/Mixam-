<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reserve Vehicle - Mixam's Autos</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="logo">Mixam's Autos</div>
    </div>
  </header>

  <main class="financing-page">
    <div class="container">
      <h1>Reserve This Vehicle</h1>
      <p>Pay a refundable $50 reservation fee to hold the vehicle.</p>
      <form>
        <div class="form-group">
          <label>First Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" required>
        </div>
        <button type="button" onclick="alert('Redirecting to payment... (use your Flutterwave link here)')" class="btn btn-primary">Pay $50 Reservation Fee</button>
      </form>
    </div>
  </main>
</body>
</html>
