<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apply for Financing - Mixam's Autos</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .financing-page {
      max-width: 720px;
      margin: 40px auto;
      padding: 40px 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #0B1F3B;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #6B7280;
      margin-bottom: 30px;
      font-size: 17px;
    }
    .form-group {
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #1C1C1C;
    }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 16px;
    }
    .checkbox-group {
      margin: 25px 0;
      padding: 15px;
      background: #F7F8FA;
      border-radius: 8px;
    }
    .checkbox-group label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      line-height: 1.5;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 16px;
      margin: 25px 0 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      background: #2D6CDF;
      color: white;
      cursor: pointer;
    }
    .note {
      text-align: center;
      font-size: 14px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mixam's Autos</h1>
  </header>

  <main class="financing-page">
    <h1>Apply for Financing</h1>
    <p class="subtitle">Tell us a little about yourself so we can help you get approved quickly.</p>

    <form action="https://formspree.io/f/xqegvzev" method="POST">

      <!-- 1. Personal Information -->
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" required>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" required>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="_replyto" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" required>
      </div>

      <!-- 2. Address Information -->
      <div class="form-group">
        <label>Street Address</label>
        <input type="text" name="street_address">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" name="city">
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" name="state">
      </div>
      <div class="form-group">
        <label>ZIP Code</label>
        <input type="text" name="zip_code">
      </div>
      <div class="form-group">
        <label>Time at Current Address (years/months)</label>
        <input type="text" name="time_at_address" placeholder="e.g. 3 years">
      </div>

      <!-- 3. Employment Information -->
      <div class="form-group">
        <label>Employment Status</label>
        <select name="employment_status" required>
          <option value="">Select...</option>
          <option value="Full-time">Employed full-time</option>
          <option value="Part-time">Employed part-time</option>
          <option value="Self-employed">Self-employed</option>
          <option value="Business owner">Business owner</option>
          <option value="Retired">Retired</option>
          <option value="Student">Student</option>
          <option value="Unemployed">Unemployed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Employer Name</label>
        <input type="text" name="employer_name">
      </div>
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" name="job_title">
      </div>
      <div class="form-group">
        <label>Time at Job</label>
        <input type="text" name="time_at_job" placeholder="e.g. 2 years">
      </div>
      <div class="form-group">
        <label>Monthly Income (before tax)</label>
        <input type="number" name="monthly_income" placeholder="e.g. 4500">
      </div>
      <div class="form-group">
        <label>Other Income Source (optional)</label>
        <input type="text" name="other_income">
      </div>

      <!-- 4. Finance Preferences -->
      <div class="form-group">
        <label>Desired Monthly Payment Budget</label>
        <input type="number" name="monthly_budget" placeholder="e.g. 400">
      </div>
      <div class="form-group">
        <label>Down Payment Amount</label>
        <input type="number" name="down_payment" placeholder="e.g. 2000">
      </div>
      <div class="form-group">
        <label>Desired Vehicle (optional)</label>
        <input type="text" name="desired_vehicle" placeholder="e.g. 2013 Ford F-150">
      </div>
      <div class="form-group">
        <label>Loan Term Preference</label>
        <select name="loan_term">
          <option value="">Select...</option>
          <option value="24">24 months</option>
          <option value="36">36 months</option>
          <option value="48">48 months</option>
          <option value="60">60 months</option>
          <option value="72">72 months</option>
        </select>
      </div>

      <!-- 5. Credit Profile -->
      <div class="form-group">
        <label>Credit Score Range (optional)</label>
        <select name="credit_score">
          <option value="">Select...</option>
          <option value="Excellent">Excellent (720+)</option>
          <option value="Good">Good (660–719)</option>
          <option value="Fair">Fair (600–659)</option>
          <option value="Poor">Poor (below 600)</option>
          <option value="Not sure">Not sure</option>
        </select>
      </div>

      <!-- 6. Identification -->
      <div class="form-group">
        <label>Driver’s License Number (optional)</label>
        <input type="text" name="drivers_license">
      </div>

      <!-- 7. Agreements -->
      <div class="checkbox-group">
        <label>
          <input type="checkbox" name="agreement_contact" required>
          I agree to be contacted regarding my financing request.
        </label>
      </div>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" name="agreement_accuracy" required>
          I confirm the information provided is accurate.
        </label>
      </div>

      <button type="submit" class="btn">Apply for Financing</button>
    </form>

    <p class="note">Our team will review your application and contact you shortly.</p>
  </main>

  <footer>
    <p>&copy; 2025 Mixam's Autos. All rights reserved. | Contact: mixam1autos@outlook.com</p>
  </footer>
</body>
</html>
